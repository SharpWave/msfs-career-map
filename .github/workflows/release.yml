# The release workflow (distribution-design, Releases): a pushed v<version> tag builds, tests and
# drafts a release; a dry-run-v<version> tag runs every step but the draft, from whichever branch it is
# on. Nothing is ever published here: the maintainer publishes a draft by hand.
name: Release

on:
  push:
    tags: ["v*", "dry-run-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Bash, so `npm run <script> -- <flags>` passes its flags on: Windows PowerShell drops the bare `--`.
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The tests keep their databases in the temp folder. The runner's C: drive, where TEMP points, commits
      # SQLite transactions hundreds of times slower than its D: drive, so the large import's wall-clock
      # tests would measure the disk; the runner's own temp folder is on D:.
      - name: Keep temp files on the runner's fast drive
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the tag against package.json
        run: npx --yes tsx scripts/release/tag.ts "${{ github.ref_name }}"

      - name: Stop if this version is already published
        if: startsWith(github.ref_name, 'v')
        run: npx --yes tsx scripts/release/published.ts "$(node -p "require('./package.json').version")"

      - name: Install
        run: npm ci

      - name: Fetch Electron's binary
        run: npx install-electron

      - name: Install the Playwright browser
        run: npx playwright install chromium

      - name: Type checks
        run: npm run typecheck

      # The wall-clock tests of a large airport import measure how long the server's event loop is held,
      # so they run alone: beside every other test file at once, a 4-core runner measures the others too.
      - name: Vitest
        env:
          CAREER_MAP_TIMED_TESTS: apart
        run: npm test

      - name: Vitest, the import's timing tests alone
        run: npx vitest run tests/airports/import.test.ts tests/app-shell/server-airports.test.ts

      - name: The include's tests
        run: npm run test:installer

      - name: Browser tests
        run: npm run test:e2e

      - name: Build the page, the bundles and fresh seed lists
        run: npm run desktop:build -- --fresh

      - name: Package, unpacked and as the installer
        run: npx electron-builder --win --x64 --publish never

      - name: Packaged smoke test
        run: npm run test:packaged

      - name: Build the newer installer for the round trip
        run: |
          trip="$(npx tsx scripts/release/seed.ts --trip-version "$(node -p "require('./package.json').version")")"
          echo "TRIP_VERSION=$trip" >> "$GITHUB_ENV"
          npx electron-builder --win --x64 --publish never --config.extraMetadata.version="$trip" --config.directories.output=release/trip

      - name: Installer round trip
        env:
          CAREER_MAP_ROUND_TRIP: release-workflow
        run: |
          version="$(node -p "require('./package.json').version")"
          npx tsx scripts/release/round-trip.ts --first "release/MSFS Career Map Setup $version.exe" --newer "release/trip/MSFS Career Map Setup $TRIP_VERSION.exe"

      - name: Draft the release
        if: startsWith(github.ref_name, 'v')
        run: |
          version="$(node -p "require('./package.json').version")"
          # Uploaded under latest.yml's name for it, which electron-updater asks for (GitHub would turn
          # the local name's spaces into dots).
          installer="$(npx tsx scripts/release/assets.ts "release/MSFS Career Map Setup $version.exe" release/latest.yml release/upload)"
          npx tsx scripts/release/notes.ts "$version" "$installer" release/notes.md
          gh release create "${{ github.ref_name }}" --draft --verify-tag --title "MSFS Career Map $version" --notes-file release/notes.md "$installer" "$installer.blockmap" release/latest.yml
